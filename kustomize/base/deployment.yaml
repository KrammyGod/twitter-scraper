apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter-scraper
  labels:
    app: twitter-scraper
spec:
  # One browser per pod, and one pod.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twitter-scraper
  template:
    metadata:
      labels:
        app: twitter-scraper
    spec:
      securityContext:
        # The uid/gid the image's `node` user is created with.
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: twitter-scraper
          image: ghcr.io/krammygod/twitter-scraper
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 1280Mi
          # Chromium is slow to launch on this hardware, and until it does
          # /healthz answers 503. Without this the liveness probe would kill the
          # pod mid-startup and crashloop it forever.
          startupProbe:
            httpGet:
              path: /healthz
              port: rest
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: rest
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: rest
            periodSeconds: 30
            failureThreshold: 3
